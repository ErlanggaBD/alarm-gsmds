<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alarm Web Configurable - Preview</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
*{box-sizing:border-box}
:root{--bg:#05070f;--bg-2:#0a1020;--card:#101626;--card-2:#0d1426;--border:#232a3d;--primary:#22d3ee;--primary-2:#38bdf8;--accent:#a78bfa;--text:#f8fafc;--text-dim:#cbd5f5;--text-subtle:#94a3b8;--success:#22c55e;--warn:#f59e0b;--danger:#f87171;--surface-glow:radial-gradient(800px 400px at 50% 0%,rgba(56,189,248,.14),transparent)}
body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:radial-gradient(1400px 900px at 10% -10%,rgba(56,189,248,.16),transparent),radial-gradient(1200px 800px at 90% -20%,rgba(167,139,250,.14),transparent),linear-gradient(180deg,var(--bg) 0%,var(--bg-2) 100%);color:var(--text);line-height:1.7;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
header{position:sticky;top:0;z-index:20;background:linear-gradient(90deg,rgba(10,16,32,.92),rgba(16,22,38,.88));backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);padding:12px 28px;display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid rgba(148,163,184,.25);box-shadow:0 30px 60px -40px rgba(56,189,248,.8)}
header .brand{display:flex;align-items:center;gap:14px}
header .logo-wrap{position:relative;width:46px;height:46px;border-radius:14px;background:radial-gradient(circle at 30% 30%,#fff,#f8fafc);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 1px rgba(255,255,255,.4),0 40px 80px -60px rgba(56,189,248,.9)}
header .logo-wrap:after{content:"";position:absolute;inset:0;border-radius:14px;background:radial-gradient(circle,rgba(56,189,248,.25),transparent 70%)}
header .logo-wrap svg{width:36px;height:36px;position:relative;z-index:1}
header .brand-text h1{font-size:16px;margin:0;font-weight:600;letter-spacing:-.01em}
header .brand-text .sub{font-size:12px;color:var(--text-subtle);margin-top:2px}
nav{display:flex;flex-wrap:wrap;gap:10px;padding:16px 28px 10px;max-width:1240px;margin:0 auto;position:sticky;top:72px;z-index:15;background:linear-gradient(180deg,rgba(10,16,32,.9),rgba(10,16,32,.8));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(148,163,184,.2)}
nav button{position:relative;display:flex;align-items:center;gap:8px;border-radius:999px;padding:9px 16px;font-size:13px;font-weight:500;color:var(--text-subtle);background:transparent;border:1px solid transparent;cursor:pointer;transition:all .25s ease}
nav button:hover{color:var(--text);background:rgba(56,189,248,.14)}
nav button.active{color:var(--text);background:linear-gradient(90deg,rgba(56,189,248,.28),rgba(167,139,250,.22));border-color:rgba(56,189,248,.6);box-shadow:0 0 0 1px rgba(56,189,248,.4),0 40px 70px -50px rgba(56,189,248,.9)}
nav button.active:after{content:"";position:absolute;inset:0;border-radius:999px;background:radial-gradient(circle,rgba(255,255,255,.12),transparent 70%)}
main{padding:12px 28px 60px;max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.page{display:none}
.page.active{display:block;animation:fade-in .4s ease}
@keyframes fade-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.card{position:relative;overflow:hidden;background:var(--surface-glow),linear-gradient(180deg,rgba(255,255,255,.015),transparent),var(--card);border:1px solid rgba(148,163,184,.28);border-radius:22px;padding:28px;box-shadow:0 120px 160px -140px rgba(56,189,248,.5),0 80px 100px -90px rgba(14,165,233,.4)}
.card:before{content:"";position:absolute;inset:0;background:radial-gradient(600px 240px at 50% -10%,rgba(56,189,248,.18),transparent);pointer-events:none}
.card>*{position:relative;z-index:1}
.card+.card{margin-top:22px}
.card-header{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:24px}
.card-title-group{display:flex;flex-direction:column;gap:6px}
.card-title-group h2{margin:0;font-size:26px;letter-spacing:-.03em}
.card-title-group p{margin:0;color:var(--text-subtle);max-width:560px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 12px;font-size:12px;text-transform:uppercase;letter-spacing:.18em;color:var(--text-subtle);border:1px solid rgba(148,163,184,.4)}
.note{color:var(--text-subtle);font-size:13px}
.grid{display:grid;gap:18px}
.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid-4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1080px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}}
@media(max-width:720px){
  header{padding:10px 16px}
  nav{padding:10px 16px;gap:6px;overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  nav button{flex:0 0 auto}
  main{padding:10px 16px 40px}
  .card{padding:18px;border-radius:16px}
  .card-header{flex-direction:column;align-items:flex-start}
  .card-title-group h2{font-size:22px}
  .table thead{display:none}
  .table,.table tbody,.table tr,.table td{display:block;width:100%}
  .table tr{margin-bottom:14px;border:1px solid rgba(148,163,184,.28);border-radius:16px;overflow:hidden}
  .table td{border:none;border-bottom:1px solid rgba(148,163,184,.18)}
  .table td:last-child{border-bottom:none}
  .table td::before{content:attr(data-label);display:block;color:var(--text-subtle);font-size:12px;text-transform:uppercase;letter-spacing:.12em;margin-bottom:6px}
}
.btn{display:inline-flex;align-items:center;gap:10px;border-radius:999px;padding:11px 22px;font-weight:500;font-size:14px;border:1px solid transparent;text-decoration:none;cursor:pointer;transition:all .25s ease}
.btn-ghost{background:transparent;color:var(--text-subtle);border-color:rgba(148,163,184,.4)}
.btn-ghost:hover{color:var(--text);border-color:rgba(56,189,248,.8)}
.btn-primary{background:linear-gradient(90deg,rgba(34,211,238,1),rgba(56,189,248,1));color:#020617;box-shadow:0 60px 90px -70px rgba(56,189,248,.9)}
.btn-primary:hover{filter:brightness(1.05)}
.btn-danger{background:linear-gradient(90deg,rgba(248,113,113,.95),rgba(239,68,68,.9));color:#fff}
.input{width:100%;border-radius:14px;border:1px solid rgba(148,163,184,.4);background:linear-gradient(180deg,rgba(255,255,255,.01),transparent),rgba(15,23,42,.7);color:var(--text);padding:12px 18px;font-size:15px;font-family:inherit;transition:all .2s ease}
.input:focus{outline:none;border-color:rgba(56,189,248,.8);box-shadow:0 0 0 4px rgba(56,189,248,.12)}
.table{width:100%;border-collapse:separate;border-spacing:0 12px}
.table thead th{color:var(--text-subtle);font-weight:500;text-align:left;padding:0 18px;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.table tbody tr{background:linear-gradient(180deg,rgba(255,255,255,.01),transparent)}
.table tbody td{padding:16px 18px;border-top:1px solid rgba(148,163,184,.28);border-bottom:1px solid rgba(148,163,184,.28)}
.table tbody td:first-child{border-left:1px solid rgba(148,163,184,.28);border-top-left-radius:16px;border-bottom-left-radius:16px}
.table tbody td:last-child{border-right:1px solid rgba(148,163,184,.28);border-top-right-radius:16px;border-bottom-right-radius:16px}
</style>
</head>

  app.appendChild(page('alarm', `<div style="max-width:900px;margin:0 auto"><div style="background:#021A2B;border-radius:18px;padding:20px"><h2 style="text-align:center;font-size:48px;color:#fff;margin:10px 0 20px">Alarm Configuration</h2><div style="text-align:center;margin-bottom:20px"><svg width="213" height="118"><use href="#logoAnmed"/></svg></div>${[0,1,2,3,4,5].map(i=>{const g=mock.gasThresholds[i]; const dis=g.name==='Not Used'?'disabled':''; return `<div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;justify-content:center;flex-wrap:wrap"><div style="background:${g.backgroundColor};color:${g.textColor};padding:16px 30px;border-radius:12px;min-width:200px;text-align:center">${g.name}</div>${mock.TYPEALARM==2?'':`<input type="number" value="${g.veryLow}" ${dis} style="padding:16px;border-radius:12px;border:1px solid #ccc;width:90px;text-align:center">`}<input type="number" value="${g.low}" ${dis} style="padding:16px;border-radius:12px;border:1px solid #ccc;width:90px;text-align:center"><input type="number" value="${g.high}" ${dis} style="padding:16px;border-radius:12px;border:1px solid #ccc;width:90px;text-align:center">${mock.TYPEALARM==2?'':`<input type="number" value="${g.veryHigh}" ${dis} style="padding:16px;border-radius:12px;border:1px solid #ccc;width:90px;text-align:center`}<div style="width:40px">${g.unit}</div></div>`;}).join('')}<div style="display:flex;justify-content:space-between;margin-top:24px"><button onclick="showPage('main')" style="background:#1A6E97;color:#fff;border:none;padding:16px 40px;border-radius:12px;display:flex;align-items:center;gap:10px"><svg width="40" height="40"><use href="#iconBack"/></svg>Back</button><button style="background:#ed3237;color:#fff;border:none;padding:16px 40px;border-radius:12px">Factory Reset</button><button style="background:#1A6E97;color:#fff;border:none;padding:16px 40px;border-radius:12px;display:flex;align-items:center;gap:10px"><svg width="40" height="40"><use href="#iconSave"/></svg>Save</button></div></div></div>`));

  // CALIBRATION
  app.appendChild(page('calibration', `<div style="max-width:900px;margin:0 auto"><div style="background:#021A2B;border-radius:18px;padding:20px"><h2 style="text-align:center;font-size:48px;color:#fff;margin:10px 0 20px">Alarm Calibration</h2><div style="text-align:center;margin-bottom:20px"><svg width="213" height="118"><use href="#logoAnmed"/></svg></div>${[0,1,2,3,4,5].map(i=>{const g=mock.gasThresholds[i]; const dis=g.name==='Not Used'?'disabled':''; return `<div style="display:flex;align-items:center;gap:16px;margin-bottom:14px;justify-content:center"><input type="checkbox" style="transform:scale(2.5)"><div style="background:${g.backgroundColor};color:${g.textColor};padding:14px 26px;border-radius:12px;min-width:200px;text-align:center">${g.name}</div><input type="number" value="${mock.offset[i]}" ${dis} style="padding:14px;border-radius:12px;border:1px solid #ccc;width:90px;text-align:center"><input type="number" value="${mock.fullScale[i]}" ${dis} style="padding:14px;border-radius:12px;border:1px solid #ccc;width:90px;text-align:center"><div style="width:40px">${g.unit}</div></div>`;}).join('')}<div style="display:flex;justify-content:space-between;margin-top:24px"><button onclick="showPage('main')" style="background:#1A6E97;color:#fff;border:none;padding:16px 40px;border-radius:12px;display:flex;align-items:center;gap:10px"><svg width="40" height="40"><use href="#iconBack"/></svg>Back</button><button style="background:#1A6E97;color:#fff;border:none;padding:16px 60px;border-radius:12px">Zero</button><button style="background:#1A6E97;color:#fff;border:none;padding:16px 40px;border-radius:12px;display:flex;align-items:center;gap:10px"><svg width="40" height="40"><use href="#iconCal"/></svg>Calibrate</button></div></div></div>`));

  // NETWORK
  app.appendChild(page('network', `<div style="max-width:900px;margin:0 auto"><div style="background:#021A2B;border-radius:18px;padding:30px"><h2 style="text-align:center;font-size:48px;color:#fff;margin:10px 0 20px">Alarm Config</h2><div style="text-align:center;margin-bottom:20px"><svg width="213" height="118"><use href="#logoAnmed"/></svg></div>${[['SSID',mock.ssid],['PASS',mock.password],['IP',mock.IP],['SUBNET',mock.subnetMask],['GATEWAY',mock.gateway]].map(([l,v])=>`<div style="display:flex;align-items:center;gap:20px;margin-bottom:16px;justify-content:center"><div style="background:#D2D3D5;color:#000;padding:16px 30px;border-radius:12px;min-width:200px;text-align:center">${l}</div><input type="text" value="${v}" style="padding:16px;border-radius:12px;border:1px solid #ccc;width:320px;text-align:center;font-size:16px"></div>`).join('')}<div style="display:flex;align-items:center;gap:20px;margin-bottom:16px;justify-content:center"><div style="background:#D2D3D5;color:#000;padding:16px 30px;border-radius:12px;min-width:200px;text-align:center">Standar Warna</div><label style="display:flex;align-items:center;gap:8px"><input type="radio" name="c" checked> NFPA</label><label style="display:flex;align-items:center;gap:8px"><input type="radio" name="c"> ISO</label></div><div style="display:flex;align-items:center;gap:20px;margin-bottom:16px;justify-content:center"><div style="background:#D2D3D5;color:#000;padding:16px 30px;border-radius:12px;min-width:200px;text-align:center">Unit</div><label style="display:flex;align-items:center;gap:8px"><input type="radio" name="u" checked> PSIG</label><label style="display:flex;align-items:center;gap:8px"><input type="radio" name="u"> BAR</label></div><div style="display:flex;justify-content:space-between;margin-top:24px"><button onclick="showPage('main')" style="background:#1A6E97;color:#fff;border:none;padding:16px 40px;border-radius:12px;display:flex;align-items:center;gap:10px"><svg width="40" height="40"><use href="#iconBack"/></svg>Back</button><button style="background:#ed3237;color:#fff;border:none;padding:16px 40px;border-radius:12px">Factory Reset</button><button style="background:#1A6E97;color:#fff;border:none;padding:16px 40px;border-radius:12px;display:flex;align-items:center;gap:10px"><svg width="40" height="40"><use href="#iconSave"/></svg>Save</button></div></div></div>`));

  // PASSWORD
  app.appendChild(page('password', `<div style="display:flex;align-items:center;justify-content:center;min-height:60vh"><div style="background:#fff;color:#000;padding:50px;border-radius:10px;max-width:500px;width:100%;text-align:center"><h2 style="font-size:36px;margin:0 0 20px">Set New Pin</h2><label>New Pin:</label><br><input type="number" placeholder="Enter New Pin" maxlength="6" style="width:100%;padding:18px;margin:16px 0;border:2px solid #ccc;border-radius:8px;font-size:22px"><div style="display:flex;gap:16px"><button onclick="showPage('main')" style="flex:1;padding:18px;background:#ccc;border:none;border-radius:8px;font-size:22px">Cancel</button><button style="flex:1;padding:18px;background:#1A6E97;color:#fff;border:none;border-radius:8px;font-size:22px">Save</button></div></div></div>`));

  // MAPPING
  app.appendChild(page('mapping', `<div style="max-width:980px;margin:0 auto"><div style="background:linear-gradient(135deg,#0e3044,#184c6a);padding:18px;border-radius:18px;text-align:center"><h1 style="margin:0;color:#e8eef2">Konfigurasi Slot Alarm Gas</h1></div><div class="card" style="margin-top:14px"><div style="margin-bottom:12px;display:flex;align-items:center;gap:12px"><div style="color:#b9d7e6;min-width:120px">Serial Number</div><input type="text" value="${mock.SERIALNUMBER}" style="flex:1;padding:10px 12px;border-radius:10px;border:1px solid #1e4b66;background:#0a1a26;color:#e8eef2"></div><table style="width:100%;border-collapse:separate;border-spacing:0 8px"><thead><tr style="color:#b9d7e6;text-align:left"><th>#</th><th>Aktif</th><th>Jenis Gas</th><th>GAS</th></tr></thead><tbody>${[0,1,2,3,4,5].map(i=>`<tr style="background:#0b1a24"><td style="padding:12px;color:#99c3d8">${i+1}</td><td style="padding:12px;text-align:center"><input type="checkbox" checked></td><td style="padding:12px"><select style="width:100%;padding:10px;border-radius:10px;background:#0a1a26;color:#e8eef2;border:1px solid #1e4b66"><option>OXYGEN (1)</option><option>NITROUS (2)</option><option>MEDICAL AIR (3)</option><option>VACUUM (4)</option></select></td><td style="padding:12px"><select style="width:80px;padding:10px;border-radius:10px;background:#0a1a26;color:#e8eef2;border:1px solid #1e4b66"><option>GAS 1</option><option>GAS 2</option><option>GAS 3</option></select></td></tr>`).join('')}</tbody></table><div style="display:flex;gap:10px;margin-top:10px"><button style="flex:1;padding:12px;border-radius:12px;background:#0f5f8a;color:#fff;border:1px solid #1181bb;font-weight:bold">Simpan</button><button onclick="showPage('main')" style="flex:1;padding:12px;border-radius:12px;background:#0a1a26;color:#e8eef2;border:1px solid #1e4b66">Kembali</button></div></div></div>`));

  // RESULTS
  app.appendChild(page('results', `<div style="max-width:600px;margin:0 auto"><div class="card" style="text-align:center"><h1 style="color:#fff">Result Pages</h1><p class="note">Includes: Save Success, Factory Reset, Test Success, Login Failed</p><div style="display:flex;flex-direction:column;gap:10px;margin-top:16px"><div style="background:#021A2B;padding:30px;border-radius:10px"><h2 style="color:#ff4d4f">Successfull Update!</h2><p>Update Success.</p><button onclick="showPage('main')" style="background:#1A6E97;color:#fff;border:none;padding:12px 24px;border-radius:8px">Go back</button></div><div style="background:#021A2B;padding:30px;border-radius:10px"><h2 style="color:#ff4d4f">Tersimpan</h2><p>Konfigurasi slot & ADC telah diterapkan.</p><button onclick="showPage('main')" style="background:#1A6E97;color:#fff;border:none;padding:12px 24px;border-radius:8px">Kembali</button></div><div style="background:#021A2B;padding:30px;border-radius:10px"><h2 style="color:#ff4d4f">Test Successful</h2><p>The test was executed successfully</p><button onclick="showPage('main')" style="background:#1A6E97;color:#fff;border:none;padding:12px 24px;border-radius:8px">Go back</button></div><div style="background:#021A2B;padding:30px;border-radius:10px"><h2 style="color:#ff4d4f">Incorrect PIN!</h2><p>The PIN you entered is incorrect.</p><button onclick="showPage('login')" style="background:#1A6E97;color:#fff;border:none;padding:12px 24px;border-radius:8px">Try Again</button></div></div></div></div>`));
}

function page(id,html){ const d=document.createElement('div'); d.id='page-'+id; d.className='page'; d.innerHTML=html; return d; }

renderNav();
renderAll();
showPage('login');
</script>
